[package]
name = "nzws-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "nzws-rust: VLESS/Trojan/SS websocket proxy + Nezha agent (Rust port of nzws-js)"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tonic = { version = "0.14", features = ["tls-webpki-roots", "tls-aws-lc"] }
tonic-prost = "0.14"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
base64 = "0.23"
futures-util = "0.3"

[build-dependencies]
tonic-prost-build = "0.14"
# 内置 protoc，避免构建机（Vercel / CI）必须预装 protoc
protoc-bin-vendored = "3.3"

# Vercel 官方 Rust 模板推荐的发布配置。这里用 thin LTO 而不是 fat LTO：
# 依赖树约 450 个 crate，fat LTO 会让 Vercel 构建时间翻倍而收益很小。
[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = "debuginfo"
